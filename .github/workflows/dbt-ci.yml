
name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.5 dbt-databricks==1.12.7

      - name: Create CI profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          marketing_data_platform:
            target: dev
            outputs:
              dev:
                type: databricks
                host: placeholder.cloud.databricks.com
                http_path: /sql/1.0/warehouses/placeholder
                token: placeholder
                catalog: bronze_production
                schema: marketing_dev
                threads: 1
          EOF

      - name: Validate dbt project
        run: dbt parse --profiles-dir ~/.dbt
        working-directory: .
